<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StandBy">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<title>StandBy Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Outfit:wght@100;200;400;600&family=DM+Serif+Display&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#ff9f0a; --accent2:#ff5e3a; --tint:#2a1606;
  --card:#1c1c1e; --card2:#2c2c2e; --text:#fff; --sub:rgba(235,235,245,.6);
  --r:clamp(22px,4.5vmin,40px); --gap:clamp(10px,2.4vmin,22px);
  --dim:1; --shiftX:0px; --shiftY:0px;
  --clockFont:ui-rounded,"SF Pro Rounded","Nunito",system-ui,sans-serif; --clockW:900;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:var(--text);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}

/* ---------- sfondo ---------- */
#bg{position:fixed;inset:-15%;z-index:0;opacity:0;transition:opacity 1s,background 1.2s;pointer-events:none}
#bg img{width:100%;height:100%;object-fit:cover;filter:blur(70px) saturate(1.6);transform:scale(1.2)}
body.bg-blur #bg{opacity:.55}
body.bg-blur #bg img{display:block}
body.bg-gradient #bg{opacity:1;background:radial-gradient(120% 90% at 15% 10%,var(--tint) 0%,#000 70%)}
body.bg-gradient #bg img,body.bg-black #bg img{display:none}

/* ---------- app ---------- */
#app{position:fixed;inset:0;z-index:1;overflow:hidden;
  transform:translate(var(--shiftX),var(--shiftY));transition:transform 3s ease}
.views{display:flex;height:100%;width:100%;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.view{flex:0 0 100%;height:100%;min-width:0;position:relative;
  padding:max(env(safe-area-inset-top),var(--gap)) max(env(safe-area-inset-right),var(--gap)) max(env(safe-area-inset-bottom),calc(var(--gap) + 10px)) max(env(safe-area-inset-left),var(--gap))}
.dots{position:fixed;left:50%;bottom:max(6px,calc(env(safe-area-inset-bottom) - 8px));transform:translateX(-50%);display:flex;gap:7px;z-index:5;opacity:.35;transition:opacity .4s}
.dots i{width:6px;height:6px;border-radius:9px;background:#fff;opacity:.35;transition:all .3s}
.dots i.on{opacity:1;width:16px}
body.chrome .dots{opacity:1}

/* ---------- split (vista 1) ---------- */
.split{display:grid;height:100%;gap:var(--gap);grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
body.swap .split .clockBox{order:2}
@media (orientation:portrait){
  .split{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
  body.swap .split .clockBox{order:0}
}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;position:relative;container-type:size}
body.bg-blur .card,body.bg-gradient .card{background:rgba(44,44,46,.55);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px)}
.clockBox{container-type:size;display:flex;align-items:center;justify-content:center;min-height:0}

/* ---------- orologio ---------- */
.clock{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%}
.digits{font-family:var(--clockFont);font-weight:var(--clockW);line-height:.9;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;display:flex;align-items:baseline;white-space:nowrap;
  background:linear-gradient(180deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;
  transition:--accent 1s}
.digits .colon{opacity:.85;margin:0 .02em;transform:translateY(-.06em)}
.digits .sec{font-size:.26em;margin-left:.18em;align-self:flex-start;margin-top:.35em;letter-spacing:0}
.clock .date{font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);opacity:.9;margin-top:.6em;white-space:nowrap}
.clock[data-style="digital"] .digits{font-size:min(30cqw,62cqh)}
.clock[data-style="digital"].secs .digits{font-size:min(25cqw,58cqh)}
.clock .date{font-size:max(12px,min(5.2cqw,8cqh))}
.clock[data-style="stacked"] .digits{flex-direction:column;align-items:center;font-size:min(38cqh,50cqw);line-height:.86}
.clock[data-style="stacked"] .colon{display:none}
.clock[data-style="stacked"] .sec{font-size:.22em;margin:.25em 0 0;align-self:center}
.clock[data-style="stacked"] .date{margin-top:.4em}
.analog{display:none;width:min(88cqw,80cqh);aspect-ratio:1}
.clock[data-style="analog"] .digits{display:none}
.clock[data-style="analog"] .analog{display:block}
.clock[data-style="analog"] .date{margin-top:.5em}
.analog .face{fill:var(--card)} body.bg-blur .analog .face,body.bg-gradient .analog .face{fill:rgba(44,44,46,.55)}
.analog .tick{stroke:#fff;stroke-linecap:round}
.analog .num{fill:#fff;font-family:var(--clockFont);font-weight:800;font-size:15px;text-anchor:middle;dominant-baseline:central}
.analog .hh,.analog .mh{stroke:#fff;stroke-linecap:round}
.analog .sh{stroke:var(--accent);stroke-linecap:round}
.analog .pin{fill:var(--accent)}
body.font-classic .clock .date,body.font-mono .clock .date{font-family:var(--clockFont)}

/* ---------- player ---------- */
.player{height:100%;display:flex;flex-direction:column;padding:max(14px,6.5cqmin);gap:max(8px,3.5cqmin);min-height:0}
.p-top{display:flex;gap:max(10px,4.5cqmin);align-items:center;min-height:0;flex:1}
.cover{height:100%;max-height:min(100%,50cqw);aspect-ratio:1;border-radius:calc(var(--r)*.55);object-fit:cover;background:var(--card2);
  box-shadow:0 10px 40px rgba(0,0,0,.45);flex:0 0 auto;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.paused .cover{transform:scale(.94)}
.meta{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center;gap:.25em}
.title{font-weight:700;font-size:max(15px,min(7cqw,8.5cqh));line-height:1.12;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.artist{color:var(--sub);font-size:max(13px,min(5.3cqw,6.5cqh));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.devname{display:flex;align-items:center;gap:.35em;color:var(--accent);font-size:max(11px,min(3.8cqw,4.6cqh));font-weight:600;margin-top:.2em;white-space:nowrap;overflow:hidden}
.devname svg{width:1.1em;height:1.1em;flex:0 0 auto}
.prog{display:flex;flex-direction:column;gap:6px}
.bar{height:max(5px,1.6cqh);border-radius:99px;background:rgba(255,255,255,.18);position:relative;cursor:pointer;touch-action:none}
.bar::before{content:"";position:absolute;inset:-12px 0}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:inherit;background:#fff;width:0}
.times{display:flex;justify-content:space-between;color:var(--sub);font-size:max(11px,min(3.4cqw,4.2cqh));font-variant-numeric:tabular-nums}
.ctrls{display:flex;align-items:center;justify-content:space-between;gap:4px}
.ctrls button{display:grid;place-items:center;border-radius:50%;transition:transform .15s,opacity .2s}
.ctrls button:active{transform:scale(.86)}
.ctrls .sm{width:max(32px,min(10cqw,12cqh));height:max(32px,min(10cqw,12cqh));opacity:.55}
.ctrls .sm.on{opacity:1;color:var(--accent)}
.ctrls .sm svg{width:55%;height:55%}
.ctrls .md{width:max(44px,min(14cqw,17cqh));height:max(44px,min(14cqw,17cqh))}
.ctrls .md svg{width:62%;height:62%}
.ctrls .lg{width:max(54px,min(18cqw,22cqh));height:max(54px,min(18cqw,22cqh))}
.ctrls .lg svg{width:68%;height:68%}
@container (min-aspect-ratio: 13/10){
  .player{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto auto;column-gap:max(14px,5cqmin)}
  .p-top{display:contents}
  .cover{grid-row:1/4;height:100%;max-height:none;align-self:center;width:auto;max-width:48cqw}
  .meta{grid-column:2}
  .prog,.ctrls{grid-column:2}
  .title{font-size:max(15px,min(6cqw,9cqh))}
}
.empty{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;color:var(--sub);font-size:max(13px,min(4.6cqw,6cqh))}
.empty b{color:#fff;font-size:1.15em}
.empty .pill{margin-top:6px}
.noplay .empty{display:flex}
@container (max-aspect-ratio: 1/1){ .cover{max-height:min(100%,44cqw)} .player{justify-content:space-between} .p-top{flex:0 1 auto;min-height:0;height:44cqw;max-height:100%} }
.noplay .player{visibility:hidden}
.pill{background:var(--accent);color:#000;font-weight:700;padding:.65em 1.2em;border-radius:99px;font-size:max(13px,min(4.2cqw,5.4cqh))}

/* ---------- vista copertina ---------- */
.artView{display:grid;height:100%;gap:calc(var(--gap)*1.6);align-items:center;grid-template-columns:auto minmax(0,1fr);container-type:size}
.artView .bigcover{height:min(100cqh,55cqw);aspect-ratio:1;border-radius:calc(var(--r)*.7);object-fit:cover;box-shadow:0 30px 80px rgba(0,0,0,.6);background:var(--card2);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.paused .artView .bigcover{transform:scale(.93)}
.artView .side{min-width:0;display:flex;flex-direction:column;gap:max(10px,3.5cqh);padding-right:2cqw;container-type:inline-size}
.artView .title{font-size:max(20px,min(7cqw,64px));-webkit-line-clamp:3}
.artView .artist{font-size:max(15px,min(4.6cqw,34px))}
.artView .small-clock{font-family:var(--clockFont);font-weight:var(--clockW);font-size:max(18px,min(7cqw,56px));color:var(--accent);line-height:1}
.artView .ctrls .sm{width:max(36px,8cqw);height:max(36px,8cqw)}
.artView .ctrls .md{width:max(48px,11cqw);height:max(48px,11cqw)}
.artView .ctrls .lg{width:max(60px,14cqw);height:max(60px,14cqw)}
.artView .times{font-size:max(12px,2.6cqw)}
.artView .bar{height:max(6px,1.3cqw)}
@media (orientation:portrait){
  .artView{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto;justify-items:center;align-content:center}
  .artView .bigcover{height:auto;width:min(84cqw,52cqh)}
  .artView .side{width:min(100%,84cqw);padding:0}
}

/* ---------- vista solo orologio ---------- */
.clockView{height:100%;display:flex;flex-direction:column;container-type:size}
.clockView .clockBox{flex:1;container-type:size}
.clockView .clock[data-style="digital"] .digits{font-size:min(31cqw,70cqh)}
.clockView .clock[data-style="digital"].secs .digits{font-size:min(26cqw,64cqh)}
.mini{display:flex;align-items:center;gap:12px;align-self:center;max-width:min(560px,100%);padding:8px 16px 8px 8px;background:rgba(44,44,46,.6);border-radius:99px;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.mini img{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--card2)}
.mini .t{min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .t span{color:var(--sub)}
.mini button{width:34px;height:34px;display:grid;place-items:center;flex:0 0 auto}
.mini button svg{width:22px;height:22px}
.noplay .mini{display:none}

/* ---------- barra superiore ---------- */
.topbar{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));z-index:6;display:flex;gap:8px;
  opacity:0;transform:translateY(-8px);pointer-events:none;transition:all .35s}
body.chrome .topbar{opacity:1;transform:none;pointer-events:auto}
.topbar button{width:42px;height:42px;border-radius:50%;background:rgba(58,58,60,.75);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:grid;place-items:center}
.topbar button svg{width:21px;height:21px}
.topbar .wake.on{color:var(--accent)}
.topbar .wake.off{opacity:.5}

/* ---------- overlay notte e luminosità ---------- */
#dimmer{position:fixed;inset:0;background:#000;opacity:calc(1 - var(--dim));pointer-events:none;z-index:20;transition:opacity .6s}
#nightTint{position:fixed;inset:0;background:#ff1f0f;mix-blend-mode:multiply;opacity:0;pointer-events:none;z-index:19;transition:opacity 1.2s}
body.night #app,body.night #bg{filter:grayscale(1) brightness(.95) contrast(1.2)}
body.night #nightTint{opacity:1}

/* ---------- pannelli ---------- */
.sheetWrap{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s;display:flex;justify-content:flex-end}
.sheetWrap.open{opacity:1;pointer-events:auto}
.sheet{width:min(440px,100%);height:100%;background:#1c1c1e;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(30px,env(safe-area-inset-bottom)) 18px;
  transform:translateX(30px);transition:transform .35s cubic-bezier(.2,.8,.2,1);-webkit-user-select:text;user-select:text}
.sheetWrap.open .sheet{transform:none}
.sheet h2{font-size:28px;font-weight:800;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet h2 button{font-size:16px;font-weight:600;color:var(--accent)}
.sheet h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--sub);font-weight:600;margin:22px 4px 8px}
.group{background:#2c2c2e;border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;min-height:48px;font-size:16px}
.row+.row{border-top:.5px solid rgba(255,255,255,.1)}
.row.col{flex-direction:column;align-items:stretch}
.row small{color:var(--sub);font-size:13px;line-height:1.35}
.seg{display:flex;background:#1c1c1e;border-radius:10px;padding:2px;flex-wrap:wrap;justify-content:flex-end}
.seg button{padding:7px 11px;border-radius:8px;font-size:14px;color:var(--sub);font-weight:600}
.seg button.on{background:#48484a;color:#fff}
.row.col .seg{justify-content:stretch}.row.col .seg button{flex:1}
.tog{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:99px;background:#48484a;position:relative;transition:background .25s;flex:0 0 auto;cursor:pointer}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .25s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.tog:checked{background:#30d158}.tog:checked::after{transform:translateX(20px)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;outline:2px solid transparent;transition:outline-color .2s}
.swatches button.on{outline-color:#fff;border-color:#2c2c2e}
.swatches .auto{background:conic-gradient(#ff375f,#ff9f0a,#ffd60a,#30d158,#64d2ff,#0a84ff,#bf5af2,#ff375f);font-size:0}
.inp{width:100%;background:#1c1c1e;border:0;border-radius:10px;padding:11px 12px;color:#fff;font:15px ui-monospace,"JetBrains Mono",monospace}
.inp:focus{outline:2px solid var(--accent)}
.code{display:flex;gap:8px;align-items:center}
.code code{flex:1;background:#1c1c1e;border-radius:10px;padding:10px 12px;font-size:13px;word-break:break-all;color:#fff}
.btn{background:#3a3a3c;border-radius:10px;padding:10px 14px;font-weight:600;font-size:15px;white-space:nowrap}
.btn.primary{background:#1ed760;color:#000}
.btn.danger{color:#ff453a}
.status{display:flex;align-items:center;gap:8px;font-size:15px}
.status i{width:9px;height:9px;border-radius:50%;background:#8e8e93}
.status.ok i{background:#30d158}
input[type=range]{width:100%;accent-color:var(--accent)}
.devs{display:flex;flex-direction:column}
.devs button{display:flex;align-items:center;gap:12px;padding:14px;text-align:left;font-size:16px;border-top:.5px solid rgba(255,255,255,.1)}
.devs button:first-child{border-top:0}
.devs button.on{color:var(--accent);font-weight:700}
.devs svg{width:22px;height:22px;flex:0 0 auto}
.help{color:var(--sub);font-size:13px;line-height:1.45;margin:8px 4px 0}
.help a{color:var(--accent)}

#toast{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));transform:translate(-50%,-20px);z-index:40;background:rgba(58,58,60,.92);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;transition:all .3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body class="bg-black font-rounded">
<div id="bg"><img id="bgImg" alt=""></div>

<div id="app" class="paused">
  <div class="views" id="views">
    <!-- Vista 1: orologio + player -->
    <section class="view">
      <div class="split">
        <div class="clockBox"><div class="clock" data-clock></div></div>
        <div class="card" id="playerCard">
          <div class="player">
            <div class="p-top">
              <img class="cover" data-cover alt="">
              <div class="meta">
                <div class="title" data-title>—</div>
                <div class="artist" data-artist></div>
                <div class="devname" data-dev></div>
              </div>
            </div>
            <div class="prog">
              <div class="bar" data-bar><div class="fill" data-fill></div></div>
              <div class="times"><span data-pos>0:00</span><span data-rem>-0:00</span></div>
            </div>
            <div class="ctrls" data-ctrls></div>
          </div>
          <div class="empty" data-empty></div>
        </div>
      </div>
    </section>
    <!-- Vista 2: copertina grande -->
    <section class="view">
      <div class="artView">
        <img class="bigcover" data-cover alt="">
        <div class="side">
          <div class="small-clock" data-smallclock></div>
          <div class="meta"><div class="title" data-title>—</div><div class="artist" data-artist></div><div class="devname" data-dev></div></div>
          <div class="prog">
            <div class="bar" data-bar><div class="fill" data-fill></div></div>
            <div class="times"><span data-pos>0:00</span><span data-rem>-0:00</span></div>
          </div>
          <div class="ctrls" data-ctrls></div>
        </div>
      </div>
    </section>
    <!-- Vista 3: solo orologio -->
    <section class="view">
      <div class="clockView">
        <div class="clockBox"><div class="clock" data-clock></div></div>
        <div class="mini">
          <img data-cover alt="">
          <div class="t"><b data-title></b> <span data-artist></span></div>
          <button data-act="toggle" aria-label="Play/Pausa"></button>
        </div>
      </div>
    </section>
  </div>
</div>
<div class="dots" id="dots"><i></i><i></i><i></i></div>

<div class="topbar">
  <button class="wake" id="wakeBtn" aria-label="Schermo sempre acceso"></button>
  <button id="devBtn" aria-label="Dispositivi"></button>
  <button id="fsBtn" aria-label="Schermo intero"></button>
  <button id="setBtn" aria-label="Impostazioni"></button>
</div>

<div id="nightTint"></div>
<div id="dimmer"></div>
<div id="toast"></div>

<div class="sheetWrap" id="settingsWrap"><div class="sheet" id="settings"></div></div>
<div class="sheetWrap" id="devWrap"><div class="sheet">
  <h2>Dispositivi <button data-close>Fine</button></h2>
  <div class="group devs" id="devList"></div>
  <p class="help">Scegli dove far suonare la musica. Se il tuo dispositivo non compare, apri l'app Spotify su di esso e avvia un brano.</p>
</div></div>

<script>
(()=>{
"use strict";
/* ============ icone ============ */
const I={

/* ============ colori ============ */
function hsl2hex(h,s,l){h=((h%1)+1)%1;const f=n=>{const k=(n+h*12)%12,a=s*Math.min(l,1-l);const c=l-a*Math.max(-1,Math.min(k-3,9-k,1));return Math.round(c*255).toString(16).padStart(2,'0')};return '#'+f(0)+f(8)+f(4)}
function hex2hsl(hex){let r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0;const l=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h/=6}return[h,s,l]}
let autoColor=null;
function setAccent(hex){
  const [h,s,l]=hex2hsl(hex);
  const r=document.documentElement.style;
  if(s<.08){r.setProperty('--accent','#ffffff');r.setProperty('--accent2','#c7c7cc');r.setProperty('--tint','#1c1c1e');return}
  const ss=Math.max(s,.6);
  r.setProperty('--accent',hsl2hex(h,ss,Math.min(Math.max(l,.6),.7)));
  r.setProperty('--accent2',hsl2hex(h-.045,ss,.5));
  r.setProperty('--tint',hsl2hex(h,ss*.7,.2));
}
function applyAccent(){setAccent(S.accent==='auto'?(autoColor||'#ff9f0a'):S.accent)}
function extractColor(src){
  return new Promise(res=>{
    const img=new Image();img.crossOrigin='anonymous';
    img.onload=()=>{try{
      const c=document.createElement('canvas');c.width=c.height=40;const x=c.getContext('2d');x.drawImage(img,0,0,40,40);
      const d=x.getImageData(0,0,40,40).data;const B={};
      for(let i=0;i<d.length;i+=4){
        const r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;
        if(l<.12||l>.92)continue;const s=mx===mn?0:(l>.5?(mx-mn)/(2-mx-mn):(mx-mn)/(mx+mn));
        let h=0;if(mx!==mn){const dd=mx-mn;h=mx===r?(g-b)/dd+(g<b?6:0):mx===g?(b-r)/dd+2:(r-g)/dd+4;h/=6}
        const k=Math.round(h*18)%18,w=s*s*(1-Math.abs(l-.5));(B[k]=B[k]||{w:0,r:0,g:0,b:0,n:0});
        B[k].w+=w;B[k].r+=d[i]*w;B[k].g+=d[i+1]*w;B[k].b+=d[i+2]*w;
      }
      let best=null;for(const k in B)if(!best||B[k].w>best.w)best=B[k];
      if(!best||best.w<.6)return res('#ffffff');
      const hx=v=>Math.round(v/best.w).toString(16).padStart(2,'0');res('#'+hx(best.r)+hx(best.g)+hx(best.b));
    }catch(e){res(null)}};
    img.onerror=()=>res(null);img.src=src;
  });
}

/* ============ Spotify (PKCE) ============ */
const SCOPES='user-read-playback-state user-modify-playback-state user-read-currently-playing';
const REDIRECT=location.origin+location.pathname.replace(/index\.html$/,'');
const b64u=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
let tok=store.get('sbp.token',null);
async function login(){
  if(!S.clientId){toast('Inserisci prima il Client ID');return}
  if(!window.crypto||!crypto.subtle){toast('Serve una connessione https');return}
  const v=b64u(crypto.getRandomValues(new Uint8Array(48)));store.set('sbp.verifier',v);
  const ch=b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
  const st=b64u(crypto.getRandomValues(new Uint8Array(12)));store.set('sbp.state',st);
  location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:S.clientId,response_type:'code',redirect_uri:REDIRECT,
    code_challenge_method:'S256',code_challenge:ch,scope:SCOPES,state:st});
}
async function tokenReq(body){
  const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(body)});
  const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.error||'Errore token');
  tok={access:j.access_token,refresh:j.refresh_token||tok?.refresh,exp:Date.now()+(j.expires_in-60)*1000};store.set('sbp.token',tok);return tok;
}
async function handleRedirect(){
  const q=new URLSearchParams(location.search);
  if(!q.has('code')&&!q.has('error'))return;
  history.replaceState(null,'',location.pathname);
  if(q.get('error')){toast('Accesso annullato: '+q.get('error'));return}
  if(q.get('state')!==store.get('sbp.state')){toast('Accesso non valido, riprova');return}
  try{await tokenReq({grant_type:'authorization_code',code:q.get('code'),redirect_uri:REDIRECT,client_id:S.clientId,code_verifier:store.get('sbp.verifier')});toast('Spotify collegato ✓')}
  catch(e){toast('Errore: '+e.message)}
}
let refreshing=null;
async function getToken(){
  if(!tok)return null;
  if(Date.now()<tok.exp)return tok.access;
  if(!refreshing)refreshing=tokenReq({grant_type:'refresh_token',refresh_token:tok.refresh,client_id:S.clientId}).finally(()=>refreshing=null);
  try{return (await refreshing).access}catch(e){logout(true);return null}
}
function logout(silent){tok=null;store.del('sbp.token');P.connected=false;P.demo=true;loadDemo(0);if(!silent)toast('Disconnesso');renderSettings();}
async function api(path,opt={},retry=true){
  const t=await getToken();if(!t)throw new Error('noauth');
  const r=await fetch('https://api.spotify.com/v1'+path,Object.assign({},opt,{headers:Object.assign({Authorization:'Bearer '+t},opt.body?{'Content-Type':'application/json'}:{})}));
  if(r.status===401&&retry){tok.exp=0;return api(path,opt,false)}
  if(r.status===429){const ra=+r.headers.get('Retry-After')||5;pollPause=Date.now()+ra*1000;throw new Error('Troppe richieste, attendo '+ra+'s')}
  return r;
}
let pollT,pollPause=0;
async function poll(){
  clearTimeout(pollT);
  if(!tok){P.connected=false;return}
  if(document.hidden||Date.now()<pollPause){pollT=setTimeout(poll,2000);return}
  try{
    const r=await api('/me/player?additional_types=episode');
    P.connected=true;P.demo=false;
    if(r.status===204||r.status===202){P.hasItem=false;P.playing=false;render()}
    else if(r.ok){
      const j=await r.json();const it=j.item;
      P.device=j.device?.name||'';P.deviceType=j.device?.type||'';P.shuffle=!!j.shuffle_state;P.repeat=j.repeat_state||'off';
      if(!it){P.hasItem=false;P.playing=!!j.is_playing;render()}
      else{
        const imgs=it.album?.images||it.images||it.show?.images||[];
        const cover=(imgs[0]||{}).url||'';
        const changed=it.id!==P.id;
        Object.assign(P,{hasItem:true,id:it.id,title:it.name,artist:it.artists?it.artists.map(a=>a.name).join(', '):(it.show?.name||''),
          cover,dur:it.duration_ms||1,pos:j.progress_ms||0,ts:performance.now(),playing:!!j.is_playing});
        render(changed);
      }
    }
  }catch(e){if(e.message!=='noauth')console.warn(e)}
  pollT=setTimeout(poll,P.playing?3000:6000);
}
async function cmd(method,path,body){
  if(P.demo)return;
  try{const r=await api(path,{method,body:body?JSON.stringify(body):undefined});
    if(r.status===403)toast('Controllo non consentito (serve Spotify Premium)');
    else if(r.status===404)toast('Nessun dispositivo attivo: scegline uno');
  }catch(e){toast(e.message==='noauth'?'Collega Spotify nelle impostazioni':e.message)}
  setTimeout(poll,450);
}

function buildAnalog(){
  let t='';for(let i=0;i<60;i++){const a=i*6*Math.PI/180,big=i%5===0,r1=big?84:88,r2=93;
    t+=`<line class="tick" x1="${100+r1*Math.sin(a)}" y1="${100-r1*Math.cos(a)}" x2="${100+r2*Math.sin(a)}" y2="${100-r2*Math.cos(a)}" stroke-width="${big?2.6:1}" opacity="${big?1:.45}"/>`}
  for(let n=1;n<=12;n++){const a=n*30*Math.PI/180;t+=`<text class="num" x="${100+72*Math.sin(a)}" y="${100-72*Math.cos(a)}">${n}</text>`}
  return `<svg class="analog" viewBox="0 0 200 200"><circle class="face" cx="100" cy="100" r="99"/>${t}
    <line class="hh" x1="100" y1="100" x2="100" y2="54" stroke-width="7"/><line class="mh" x1="100" y1="100" x2="100" y2="30" stroke-width="4.5"/>
    <line class="sh" x1="100" y1="114" x2="100" y2="22" stroke-width="1.8"/><circle class="pin" cx="100" cy="100" r="4.5"/></svg>`;
}
$$('[data-clock]').forEach(c=>c.innerHTML=`<div class="digits"><span class="h"></span><span class="colon">:</span><span class="m"></span><span class="sec"></span></div>${buildAnalog()}<div class="date"></div>`);
const GG=['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'],MM=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
function drawClock(){
  const d=new Date();let h=d.getHours();const m=d.getMinutes(),s=d.getSeconds();
  if(!S.h24){h=h%12||12}
  const hs=S.h24?String(h).padStart(2,'0'):String(h),ms=String(m).padStart(2,'0');
  $$('[data-clock]').forEach(c=>{
    c.dataset.style=S.clock;c.classList.toggle('secs',S.secs&&S.clock==='digital');
    c.querySelector('.h').textContent=hs;c.querySelector('.m').textContent=ms;
    const se=c.querySelector('.sec');se.textContent=S.secs?String(s).padStart(2,'0'):'';se.style.display=S.secs?'':'none';
    const dt=c.querySelector('.date');dt.style.display=S.date?'':'none';dt.textContent=GG[d.getDay()]+' '+d.getDate()+' '+MM[d.getMonth()];
    const hh=c.querySelector('.hh'),mh=c.querySelector('.mh'),sh=c.querySelector('.sh');
    hh.setAttribute('transform',`rotate(${(d.getHours()%12)*30+m*.5} 100 100)`);mh.setAttribute('transform',`rotate(${m*6+s*.1} 100 100)`);
    sh.setAttribute('transform',`rotate(${s*6} 100 100)`);sh.style.display=S.secs?'':'none';
  });
  $$('[data-smallclock]').forEach(e=>e.textContent=hs+':'+ms);
}

/* ============ applica impostazioni ============ */
const body=document.body;
function isNight(){if(S.night==='on')return true;if(S.night!=='auto')return false;const h=new Date().getHours();
  return S.nightFrom>S.nightTo?(h>=S.nightFrom||h<S.nightTo):(h>=S.nightFrom&&h<S.nightTo)}
function apply(){
  body.className=body.className.replace(/\b(bg|font)-\w+/g,'').trim();
  body.classList.add('bg-'+S.bg,'font-'+S.font);
  body.classList.toggle('swap',S.swap);
  body.classList.toggle('night',isNight());
  const [ff,fw]=FONTS[S.font];const r=document.documentElement.style;r.setProperty('--clockFont',ff);r.setProperty('--clockW',fw);
  r.setProperty('--dim',S.dim/100);
  applyAccent();drawClock();
  if(!S.shift){r.setProperty('--shiftX','0px');r.setProperty('--shiftY','0px')}
}

/* ============ pannello impostazioni ============ */
const SEG=(k,label,opts,col)=>`<div class="row${col?' col':''}"><span>${label}</span><div class="seg" data-k="${k}">${opts.map(([v,t])=>`<button data-v="${v}">${t}</button>`).join('')}</div></div>`;
const TOG=(k,label,sub)=>`<label class="row"><span>${label}${sub?`<br><small>${sub}</small>`:''}</span><input type="checkbox" class="tog" data-k="${k}"></label>`;
function renderSettings(){
  const conn=!!tok;
  $('#settings').innerHTML=`
  <h2>Impostazioni <button data-close>Fine</button></h2>
  <h3>Spotify</h3>
  <div class="group">
    <div class="row"><div class="status ${conn?'ok':''}"><i></i>${conn?'Collegato':'Non collegato'}</div>
      ${conn?'<button class="btn danger" data-do="logout">Disconnetti</button>':'<button class="btn primary" data-do="login">Collega</button>'}</div>
    <div class="row col"><span>Client ID</span><input class="inp" id="cid" placeholder="es. 3f9a1c…" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(S.clientId)}"></div>
    <div class="row col"><span>Redirect URI <small>(da incollare nella dashboard Spotify)</small></span>
      <div class="code"><code>${esc(REDIRECT)}</code><button class="btn" data-do="copy">Copia</button></div></div>
  </div>
  <p class="help">Crea un'app gratuita su <a href="https://developer.spotify.com/dashboard" target="_blank" rel="noopener">developer.spotify.com/dashboard</a>, spunta “Web API”, incolla il Redirect URI qui sopra e copia il Client ID. Per i comandi serve Spotify Premium.</p>

  <h3>Orologio</h3>
  <div class="group">
    ${SEG('clock','Stile',[['digital','Digitale'],['stacked','Impilato'],['analog','Analogico']],1)}
    ${SEG('font','Carattere',[['rounded','Tondo'],['thin','Sottile'],['classic','Classico'],['mono','Mono']],1)}
    ${TOG('h24','Formato 24 ore')}${TOG('secs','Mostra secondi')}${TOG('date','Mostra data')}
  </div>

  <h3>Colore</h3>
  <div class="group"><div class="row col"><small>“Auto” prende il colore dalla copertina del brano.</small>
    <div class="swatches" id="sw"><button class="auto" data-c="auto" aria-label="Automatico">auto</button>${SWATCHES.map(c=>`<button data-c="${c}" style="background:${c}" aria-label="${c}"></button>`).join('')}</div></div></div>

  <h3>Aspetto</h3>
  <div class="group">
    ${SEG('bg','Sfondo',[['black','Nero'],['blur','Copertina'],['gradient','Sfumato']],1)}
    ${TOG('swap','Orologio a destra','In orizzontale, scambia orologio e player')}
  </div>

  <h3>Schermo</h3>
  <div class="group">
    ${TOG('wake','Schermo sempre acceso','Impedisce lo spegnimento mentre l\'app è aperta')}
    ${SEG('night','Modalità notte (rossa)',[['off','No'],['auto','Auto'],['on','Sempre']],1)}
    <div class="row"><span>Notte dalle</span><span><select class="inp" style="width:auto;display:inline-block" data-n="nightFrom">${[...Array(24)].map((_,i)=>`<option ${i==S.nightFrom?'selected':''}>${i}</option>`).join('')}</select>
      alle <select class="inp" style="width:auto;display:inline-block" data-n="nightTo">${[...Array(24)].map((_,i)=>`<option ${i==S.nightTo?'selected':''}>${i}</option>`).join('')}</select></span></div>
    <div class="row col"><span>Luminosità app</span><input type="range" min="20" max="100" value="${S.dim}" data-r="dim"></div>
    ${TOG('shift','Protezione burn-in','Sposta leggermente il contenuto ogni minuto')}
  </div>
  <p class="help">Tocca lo schermo per mostrare i pulsanti. Scorri a sinistra/destra per cambiare vista.</p>`;
  syncSettings();
}
function syncSettings(){
  $$('#settings .seg').forEach(s=>s.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===String(S[s.dataset.k]))));
  $$('#settings .tog').forEach(t=>t.checked=!!S[t.dataset.k]);
  $$('#sw button').forEach(b=>b.classList.toggle('on',b.dataset.c===S.accent));
}
$('#settings').addEventListener('click',e=>{
  const sb=e.target.closest('.seg button');if(sb){S[sb.parentNode.dataset.k]=sb.dataset.v;save();apply();syncSettings();return}
  const sw=e.target.closest('#sw button');if(sw){S.accent=sw.dataset.c;save();applyAccent();syncSettings();return}
  const d=e.target.closest('[data-do]');if(!d)return;
  if(d.dataset.do==='login'){S.clientId=$('#cid').value.trim();save();login()}
  if(d.dataset.do==='logout')logout();
  if(d.dataset.do==='copy'){navigator.clipboard?.writeText(REDIRECT).then(()=>toast('Copiato'),()=>toast('Copia manualmente'))}
});
$('#settings').addEventListener('change',e=>{
  const t=e.target;
  if(t.classList.contains('tog')){S[t.dataset.k]=t.checked;save();apply();if(t.dataset.k==='wake')S.wake?keepAwake():releaseWake()}
  if(t.dataset.n){S[t.dataset.n]=+t.value;save();apply()}
  if(t.id==='cid'){S.clientId=t.value.trim();save()}
});
$('#settings').addEventListener('input',e=>{if(e.target.dataset.r){S.dim=+e.target.value;save();apply()}});
$$('.sheetWrap').forEach(w=>w.addEventListener('click',e=>{if(e.target===w||e.target.closest('[data-close]'))w.classList.remove('open')}));

/* ============ schermo sempre acceso ============ */
let wl=null,fallbackVid=null;
async function keepAwake(){
  if(!S.wake)return;
  try{
    if('wakeLock' in navigator){if(!wl||wl.released){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',updWake)}}
    else startFallback();
  }catch(e){startFallback()}
  updWake();
}
function startFallback(){
  if(fallbackVid)return fallbackVid.play().catch(()=>{});
  try{const c=document.createElement('canvas');c.width=c.height=2;const x=c.getContext('2d');let f=0;
    setInterval(()=>{x.fillStyle=(f++%2)?'#000':'#010101';x.fillRect(0,0,2,2)},1000);
    const v=document.createElement('video');v.muted=true;v.playsInline=true;v.setAttribute('playsinline','');v.loop=true;
    v.style.cssText='position:fixed;width:1px;height:1px;opacity:0;pointer-events:none';v.srcObject=c.captureStream(1);document.body.appendChild(v);
    fallbackVid=v;v.play().catch(()=>{});}catch(e){}
}
function releaseWake(){try{wl&&wl.release()}catch{}wl=null;if(fallbackVid){fallbackVid.pause()}updWake()}
function updWake(){const b=$('#wakeBtn');const on=S.wake&&((wl&&!wl.released)||(fallbackVid&&!fallbackVid.paused));
  b.classList.toggle('on',!!on);b.classList.toggle('off',!on)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){keepAwake();poll()}});
$('#wakeBtn').innerHTML=I.sun;
$('#wakeBtn').addEventListener('click',()=>{S.wake=!S.wake;save();S.wake?(keepAwake(),toast('Schermo sempre acceso: attivo')):(releaseWake(),toast('Schermo sempre acceso: disattivato'))});

/* ============ fullscreen / topbar ============ */
$('#fsBtn').innerHTML=I.fs;$('#setBtn').innerHTML=I.gear;$('#devBtn').innerHTML=I.speaker;
if(!document.fullscreenEnabled&&!document.webkitFullscreenEnabled)$('#fsBtn').style.display='none';
$('#fsBtn').addEventListener('click',async()=>{try{const el=document.documentElement;
  if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
  else{await (el.requestFullscreen||el.webkitRequestFullscreen).call(el);try{await screen.orientation.unlock?.()}catch{}}}catch(e){toast('Schermo intero non disponibile')}});
$('#setBtn').addEventListener('click',()=>{renderSettings();$('#settingsWrap').classList.add('open')});
$('#devBtn').addEventListener('click',openDevices);
let chromeT;function showChrome(){body.classList.add('chrome');clearTimeout(chromeT);chromeT=setTimeout(()=>body.classList.remove('chrome'),4500)}

/* ============ viste e gesti ============ */
let view=Math.min(2,Math.max(0,S.view|0));
function setView(v){view=(v+3)%3;$('#views').style.transform=`translateX(${-100*view}%)`;$$('#dots i').forEach((d,i)=>d.classList.toggle('on',i===view));S.view=view;save()}
$$('#dots i').forEach((d,i)=>d.addEventListener('click',()=>setView(i)));
let sx=0,sy=0,st=0,dragBar=null;
app.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;st=Date.now();
  const bar=e.target.closest('[data-bar]');if(bar){dragBar=bar;bar.setPointerCapture?.(e.pointerId);moveBar(e)}});
function moveBar(e){const r=dragBar.getBoundingClientRect();const f=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));dragBar.querySelector('.fill').style.width=f*100+'%';return f}
app.addEventListener('pointermove',e=>{if(dragBar)moveBar(e)});
app.addEventListener('pointerup',e=>{
  keepAwake();
  if(dragBar){const f=moveBar(e);dragBar=null;seekTo(f);return}
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.3&&Date.now()-st<700){setView(view+(dx<0?1:-1));return}
  const a=e.target.closest('[data-act]');if(a){ACT[a.dataset.act]();showChrome();return}
  const o=e.target.closest('[data-open]');if(o){o.dataset.open==='dev'?openDevices():(renderSettings(),$('#settingsWrap').classList.add('open'));return}
  if(Math.abs(dx)<10&&Math.abs(dy)<10)body.classList.contains('chrome')?body.classList.remove('chrome'):showChrome();
});
document.addEventListener('keydown',e=>{if(e.target.closest('input,select'))return;
  if(e.key==='ArrowRight')setView(view+1);if(e.key==='ArrowLeft')setView(view-1);if(e.key===' '){e.preventDefault();ACT.toggle()}});

/* ============ loop ============ */
setInterval(()=>{drawClock();tick()},250);
setInterval(()=>{body.classList.toggle('night',isNight());
  if(S.shift){const r=document.documentElement.style;r.setProperty('--shiftX',(Math.round(Math.random()*8)-4)+'px');r.setProperty('--shiftY',(Math.round(Math.random()*8)-4)+'px')}},60000);

/* ============ avvio ============ */
(async()=>{
  apply();setView(view);
  await handleRedirect();
  if(tok){P.demo=false;P.hasItem=false;render();poll()}else{loadDemo(0);P.playing=true;P.ts=performance.now();render()}
  keepAwake();
  showChrome();
})();
})();
</script>
</body>
</html>
